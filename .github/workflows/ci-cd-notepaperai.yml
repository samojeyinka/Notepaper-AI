name: CI/CD - NotepaperAI

# Runs only on main. Each push goes through commit lint, backend tests with
# coverage, and a frontend lint+build before anything is deployed. Only if all
# three checks pass does the deploy job SSH into the VPS.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST    - IP or hostname of the Ubuntu VPS
#   VPS_USER    - SSH user (the `deploy` user from the deployment guide)
#   VPS_SSH_KEY - private SSH key (no passphrase) that can ssh into the VPS
#   VPS_PORT    - optional, defaults to 22

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: notepaperai-cicd
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint pushed commit messages
        run: |
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            npx --yes @commitlint/cli@19 --config commitlint.config.mjs --from "${{ github.event.before }}" --to HEAD
          else
            npx --yes @commitlint/cli@19 --config commitlint.config.mjs --from "$(git rev-list --max-parents=0 HEAD)"
          fi

  backend-tests:
    name: Backend - tests & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: Backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('Backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction --force

      # Coverage floor. Raise the --min value as the suite covers more of the
      # app; this just blocks catastrophic regressions for now.
      - name: Run tests with coverage
        env:
          XDEBUG_MODE: coverage
        run: php artisan test --coverage --min=25

  frontend-checks:
    name: Frontend - lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: [commitlint, backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          script: |
            bash /home/deploy/notepaperai-deploy.sh